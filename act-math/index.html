<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kieran's ACT Math Power Practice</title>
<meta name="description" content="Free ACT math practice: topic drills, timed tests, score estimate, and a formula cheat sheet.">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2340;--mute:#5b6485;--line:#dfe4f1;--brand:#4f46e5;--brand2:#7c3aed;--good:#0f9d58;--goodbg:#e6f6ee;--bad:#d93025;--badbg:#fdeaea;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header .in{max-width:860px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header h1{font-size:1.15rem;margin:0;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.18);color:#fff;border:0;padding:7px 12px;border-radius:999px;font-weight:600;cursor:pointer;font-size:.85rem}
nav button.on,nav button:hover{background:#fff;color:var(--brand)}
main{max-width:860px;margin:18px auto;padding:0 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,80,.05)}
h2{margin:0 0 8px;font-size:1.3rem}h3{margin:0 0 8px;font-size:1.05rem}
.mute{color:var(--mute);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{background:var(--brand);color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:700;font-size:1rem;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn.alt{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.btn.sm{padding:8px 12px;font-size:.85rem}.btn:disabled{opacity:.4;cursor:not-allowed}
.tile{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit}
.tile:hover{border-color:var(--brand)}.tile b{display:block;font-size:1rem}
.big{font-size:2.6rem;font-weight:800;color:var(--brand);line-height:1}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-weight:600;cursor:pointer;font-size:.88rem}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.q{font-size:1.15rem;font-weight:600;margin:6px 0 14px;white-space:pre-line}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:1.05rem;cursor:pointer;color:inherit}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.opt.sel{border-color:var(--brand);background:#eef0ff}
.opt.ok{border-color:var(--good);background:var(--goodbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.exp{background:#fffbea;border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px;margin:12px 0;white-space:pre-line}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.2rem;color:var(--brand)}.timer.low{color:var(--bad)}
.tag{display:inline-block;background:#eef0ff;color:var(--brand);border-radius:6px;padding:2px 9px;font-size:.78rem;font-weight:700}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;font-size:.95rem;vertical-align:top}
.rv{border-left:5px solid var(--line);padding:8px 12px;margin:10px 0;background:#fafbff;border-radius:6px}
.rv.ok{border-color:var(--good)}.rv.no{border-color:var(--bad)}
ul{padding-left:20px;margin:6px 0}code{background:#eef0ff;padding:1px 6px;border-radius:5px}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.dots i{width:14px;height:14px;border-radius:4px;background:var(--line)}.dots i.a{background:var(--brand)}.dots i.c{background:var(--brand);opacity:.45}
.dots i.f{background:var(--warn);opacity:1}.dots i.f.a{outline:2px solid var(--brand)}
.pop{animation:pop .3s}@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

#cfab{position:fixed;right:16px;bottom:16px;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:1.7rem;cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,.45);z-index:50}
#cpanel{position:fixed;right:16px;bottom:84px;width:min(330px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(20,30,80,.3);padding:12px;z-index:50;display:none}
#cpanel.open{display:block}
#cpanel .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
#cpanel .hd button{border:0;background:none;font-size:1.2rem;cursor:pointer;color:var(--mute)}
#chist{min-height:1.2em;text-align:right;color:var(--mute);font-size:.85rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#cdisp{width:100%;font-size:1.5rem;text-align:right;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-variant-numeric:tabular-nums;color:var(--ink)}
#ckeys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#ckeys button{padding:10px 0;border:0;border-radius:10px;background:var(--bg);font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;color:var(--ink)}
#ckeys button:active{filter:brightness(.9)}
#ckeys .op{background:#eef0ff;color:var(--brand)}#ckeys .eq{background:var(--brand);color:#fff;grid-column:span 2}#ckeys .cl{background:var(--badbg);color:var(--bad)}
</style>
</head>
<body>
<header><div class="in"><h1 onclick="go('home')">📐 Kieran's ACT Math Prep</h1>
<nav id="nav"></nav></div></header>
<main id="app"></main>

<button id="cfab" aria-label="Open calculator" title="Calculator">🧮</button>
<div id="cpanel" role="dialog" aria-label="Calculator"><div class="hd"><span>Calculator</span><button id="cx" aria-label="Close">✕</button></div>
<div id="chist"></div><input id="cdisp" inputmode="none" autocomplete="off" spellcheck="false" placeholder="0"><div id="ckeys"></div></div>
<script>
/* ---------- helpers ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const fmt=n=>Number(n).toLocaleString('en-US');
const NUM=/^-?\d+(\.\d+)?$/;
const TOPICS=['Algebra','Functions','Geometry','Trigonometry','Stats & Probability','Number & Quantity'];
const LET=['A','B','C','D','E'];

function mk(t,q,ans,dis,e){
  ans=String(ans);const set=[ans];
  for(const d of dis){const s=String(d);if(!set.includes(s))set.push(s);if(set.length===5)break}
  if(NUM.test(ans)){for(let k=1;set.length<5&&k<60;k++){const s=String(+ans+(k%2?1:-1)*Math.ceil(k/2));if(!set.includes(s))set.push(s)}}
  const c=set.every(s=>NUM.test(s))?set.slice().sort((x,y)=>x-y):shuffle(set);
  return{t,q,c,a:c.indexOf(ans),e};
}
const H=(t,q,c,a,e)=>({t,q,c,a,e,id:q});

/* ---------- hand-written bank ---------- */
const BANK=[
H('Algebra','If 3x − 7 = 20, what is x?',['6','7','9','11','27'],2,'Add 7: 3x = 27. Divide by 3: x = 9.'),
H('Algebra','Solve for x: 2(x + 3) = 5x − 9',['3','5','7','9','15'],1,'2x + 6 = 5x − 9 → 15 = 3x → x = 5.'),
H('Algebra','What is the slope of the line through (2, 5) and (6, 13)?',['1/2','1','2','4','8'],2,'Slope = rise/run = (13−5)/(6−2) = 8/4 = 2.'),
H('Algebra','What is the sum of the solutions of x² − 5x + 6 = 0?',['1','5','6','−5','−6'],1,'Factor: (x−2)(x−3)=0 → x = 2, 3. Sum = 5. Shortcut: sum of roots = −b/a = 5.'),
H('Algebra','If x + y = 10 and x − y = 4, what is xy?',['12','21','24','30','40'],1,'Add equations: 2x = 14 → x = 7, y = 3. xy = 21.'),
H('Algebra','Which is the solution to 3x − 4 > 11?',['x > 3','x > 5','x > 7','x < 5','x < −5'],1,'3x > 15 → x > 5. (Only flip the sign when dividing by a negative.)'),
H('Algebra','Which line is parallel to y = −2x + 3 and passes through (1, 4)?',['y = −2x + 3','y = −2x + 6','y = 2x + 2','y = ½x + 3.5','y = −2x + 2'],1,'Parallel = same slope (−2). Plug in (1,4): 4 = −2(1) + b → b = 6.'),
H('Algebra','If a = 3 and b = −2, what is a² − 2ab + b²?',['1','13','25','35','49'],2,'It equals (a − b)² = (3 − (−2))² = 5² = 25. Or: 9 + 12 + 4 = 25.'),
H('Algebra','What is the sum of all solutions to |2x − 3| = 7?',['2','3','5','7','10'],1,'2x − 3 = 7 → x = 5;  2x − 3 = −7 → x = −2. Sum = 3.'),
H('Algebra','A jacket costs $80. It is discounted 20%, then that price is discounted another 10%. What is the final price?',['$56.00','$57.60','$58.00','$60.00','$62.40'],1,'80 × 0.80 = 64. Then 64 × 0.90 = $57.60. Discounts multiply, they don\'t add.'),
H('Algebra','A train travels 240 miles in 4 hours. At the same rate, how many miles in 9 hours?',['480','510','540','560','600'],2,'Rate = 240/4 = 60 mph. 60 × 9 = 540.'),
H('Algebra','The ratio of boys to girls in a class is 3:5. If there are 40 students, how many are girls?',['15','20','24','25','30'],3,'3 + 5 = 8 parts. 40/8 = 5 per part. Girls = 5 × 5 = 25.'),
H('Algebra','If x² + 4x + k = 0 has exactly one real solution, what is k?',['1','2','4','8','16'],2,'One solution → discriminant = 0: b² − 4ac = 16 − 4k = 0 → k = 4.'),
H('Algebra','Lori can mow a lawn in 3 hours. Tim can mow it in 6 hours. Working together, how many hours?',['1.5','2','3','4.5','9'],1,'Rates add: 1/3 + 1/6 = 1/2 lawn per hour → 2 hours.'),
H('Functions','If f(x) = 2x² − 3x + 1, what is f(3)?',['4','10','12','16','22'],1,'2(9) − 9 + 1 = 18 − 9 + 1 = 10.'),
H('Functions','If f(x) = x + 4 and g(x) = 3x, what is f(g(2))?',['9','10','12','14','18'],1,'g(2) = 6. f(6) = 6 + 4 = 10. Work inside-out.'),
H('Functions','For which value of x is f(x) = 1/(x − 4) undefined?',['0','−4','4','1/4','It is defined for all x'],2,'Denominator can\'t be 0: x − 4 = 0 → x = 4.'),
H('Functions','What is the vertex of y = (x − 3)² + 2?',['(−3, 2)','(3, 2)','(3, −2)','(−3, −2)','(2, 3)'],1,'Vertex form y = (x − h)² + k has vertex (h, k) = (3, 2).'),
H('Functions','A population starts at 500 and doubles every 3 years. What is it after 9 years?',['1,500','2,000','3,000','4,000','4,500'],3,'9 years = 3 doublings. 500 × 2³ = 500 × 8 = 4,000.'),
H('Functions','What is log₂ 32?',['4','5','6','16','30'],1,'2⁵ = 32, so log₂ 32 = 5.'),
H('Functions','Which is equivalent to (2x³)² · x?',['2x⁶','2x⁷','4x⁶','4x⁷','4x⁹'],3,'(2x³)² = 4x⁶. Times x → 4x⁷. (Square the 2 too!)'),
H('Functions','If 2^(x+1) = 32, what is x?',['3','4','5','15','16'],1,'32 = 2⁵ → x + 1 = 5 → x = 4.'),
H('Functions','What is the 20th term of the arithmetic sequence 4, 7, 10, 13, …?',['57','60','61','64','80'],2,'aₙ = a₁ + (n−1)d = 4 + 19(3) = 61.'),
H('Functions','What is the 8th term of the geometric sequence 3, 6, 12, 24, …?',['192','256','384','768','1,536'],2,'aₙ = 3 · 2^(n−1) → 3 · 2⁷ = 3 · 128 = 384.'),
H('Functions','What is the value of 8^(2/3)?',['2','4','6','16','64'],1,'Cube root of 8 = 2, then square: 2² = 4.'),
H('Geometry','A rectangle has perimeter 30. Its length is twice its width. What is its area?',['25','50','75','100','200'],1,'2(w + 2w) = 30 → 6w = 30 → w = 5, l = 10. Area = 50.'),
H('Geometry','A circle has circumference 10π. What is its area?',['5π','10π','25π','50π','100π'],2,'C = 2πr → r = 5. Area = πr² = 25π.'),
H('Geometry','A right triangle has legs 9 and 12. What is the hypotenuse?',['13','14','15','17','21'],2,'It\'s a 3-4-5 triangle ×3 → 9-12-15.'),
H('Geometry','Two angles of a triangle measure 35° and 65°. What is the third angle?',['70°','75°','80°','85°','90°'],2,'Angles sum to 180°: 180 − 35 − 65 = 80°.'),
H('Geometry','What is the sum of the interior angles of a hexagon?',['540°','600°','720°','900°','1080°'],2,'(n − 2) × 180 = 4 × 180 = 720°.'),
H('Geometry','A 3-4-5 triangle is similar to a larger triangle with hypotenuse 15. What is the larger triangle\'s perimeter?',['12','24','36','45','60'],2,'Scale factor = 15/5 = 3. Perimeter 12 × 3 = 36.'),
H('Geometry','A cylinder has radius 3 and height 5. What is its volume?',['15π','30π','45π','90π','135π'],2,'V = πr²h = π(9)(5) = 45π.'),
H('Geometry','What is the distance between (1, 2) and (7, 10)?',['8','10','12','14','√48'],1,'√[(7−1)² + (10−2)²] = √(36 + 64) = √100 = 10.'),
H('Geometry','What is the midpoint of the segment with endpoints (−2, 4) and (6, 10)?',['(2, 7)','(4, 14)','(4, 7)','(2, 3)','(−4, −3)'],0,'Average the coordinates: ((−2+6)/2, (4+10)/2) = (2, 7).'),
H('Geometry','A circle has radius 6. What is the length of an arc with a central angle of 60°?',['π','2π','3π','6π','12π'],1,'Arc = (60/360) × 2π(6) = (1/6)(12π) = 2π.'),
H('Geometry','In a 30-60-90 triangle the shorter leg is 5. What is the longer leg?',['5√2','5√3','10','10√3','15'],1,'Sides are x, x√3, 2x. Shorter leg 5 → longer leg 5√3, hypotenuse 10.'),
H('Geometry','What is the radius of the circle x² + y² − 6x + 4y − 3 = 0?',['3','4','√13','16','√3'],1,'Complete the square: (x−3)² + (y+2)² = 3 + 9 + 4 = 16 → r = 4.'),
H('Trigonometry','In a right triangle, sin θ = 3/5. What is cos θ (θ acute)?',['3/4','4/5','5/4','5/3','3/5'],1,'Opposite = 3, hypotenuse = 5, so adjacent = 4 (3-4-5). cos = 4/5.'),
H('Trigonometry','What is tan 45°?',['0','1/2','√2/2','1','√3'],3,'At 45° opposite = adjacent, so tan = 1.'),
H('Trigonometry','If sin θ = 0.6, what is cos²θ?',['0.36','0.4','0.64','0.8','1.6'],2,'sin²θ + cos²θ = 1 → cos²θ = 1 − 0.36 = 0.64.'),
H('Trigonometry','A right triangle has a 30° angle and hypotenuse 12. How long is the side opposite the 30° angle?',['6','6√2','6√3','12','12√3'],0,'Side opposite 30° = half the hypotenuse = 6.'),
H('Trigonometry','What is 135° in radians?',['π/4','π/2','2π/3','3π/4','5π/6'],3,'135 × (π/180) = 3π/4.'),
H('Trigonometry','What is the period of y = sin(2x)?',['π/2','π','2π','4π','1'],1,'Period = 2π/|b| = 2π/2 = π.'),
H('Trigonometry','If cos θ = 5/13 with θ acute, what is sin θ?',['5/12','12/13','13/12','8/13','12/5'],1,'5-12-13 triangle: opposite = 12, so sin = 12/13.'),
H('Stats & Probability','What is the mean of 4, 8, 10, 12, 16?',['8','10','11','12','50'],1,'Sum = 50; 50 ÷ 5 = 10.'),
H('Stats & Probability','What is the median of 3, 9, 4, 12, 7, 15?',['7','8','9','10','12'],1,'Sort: 3, 4, 7, 9, 12, 15. Middle two are 7 and 9 → median 8.'),
H('Stats & Probability','The mean of 5 numbers is 12. A sixth number, 18, is added. What is the new mean?',['12.5','13','14','15','18'],1,'Old total = 60. New total = 78. 78 ÷ 6 = 13.'),
H('Stats & Probability','A bag has 4 red and 6 blue marbles. What is the probability of drawing a blue one?',['2/5','1/2','3/5','2/3','3/4'],2,'6 blue out of 10 total = 3/5.'),
H('Stats & Probability','Two fair dice are rolled. What is the probability the sum is 7?',['1/12','1/9','1/6','1/4','7/36'],2,'6 ways (1-6, 2-5, 3-4, 4-3, 5-2, 6-1) out of 36 = 1/6.'),
H('Stats & Probability','An outfit is 1 of 3 shirts, 1 of 4 pants, and 1 of 2 hats. How many outfits?',['9','12','18','24','36'],3,'Multiply choices: 3 × 4 × 2 = 24.'),
H('Stats & Probability','In how many ways can 5 people stand in a line?',['25','60','100','120','240'],3,'5! = 5·4·3·2·1 = 120.'),
H('Stats & Probability','How many ways can a committee of 2 be chosen from 6 people?',['12','15','30','36','720'],1,'C(6,2) = (6·5)/(2·1) = 15. Order doesn\'t matter.'),
H('Number & Quantity','Simplify √72.',['3√8','6√2','8√3','12√6','36'],1,'√72 = √(36·2) = 6√2.'),
H('Number & Quantity','What is (2 + 3i)(2 − 3i)? (i² = −1)',['−5','5','13','−13','4 + 9i'],2,'(a+b)(a−b) = a² − b² → 4 − 9i² = 4 + 9 = 13.'),
H('Number & Quantity','What is (3 × 10⁴)(2 × 10³)?',['5 × 10⁷','6 × 10⁷','6 × 10¹²','5 × 10¹²','6 × 10¹⁰'],1,'Multiply 3·2 = 6; add exponents 4 + 3 = 7 → 6 × 10⁷.'),
H('Number & Quantity','What is the least common multiple of 12 and 18?',['6','24','36','72','216'],2,'12 = 2²·3, 18 = 2·3². LCM = 2²·3² = 36.'),
H('Number & Quantity','What is 15% of 240?',['24','30','36','40','48'],2,'10% = 24, 5% = 12 → 36.'),
H('Number & Quantity','Which is the greatest?',['0.4','2/5','3/8','0.41','7/20'],3,'As decimals: 0.4, 0.4, 0.375, 0.41, 0.35. Greatest = 0.41.'),
H('Number & Quantity','A home sells for $240,000. The listing agent gets 3% of the price. How much is that?',['$2,400','$4,800','$7,200','$12,000','$72,000'],2,'0.03 × 240,000 = $7,200.'),
H('Number & Quantity','If 5 is added to twice a number, the result is 27. What is the number?',['8','9','11','13','16'],2,'2n + 5 = 27 → 2n = 22 → n = 11.')
,
H('Algebra','If 2^x = 8^(y − 1) and y = 4, what is x?',['6','8','9','12','16'],2,'8^(3) = (2³)³ = 2⁹, so x = 9. Rewrite both sides with the same base.'),
H('Algebra','If 2x + 3y = 12 and 4x − y = 10, what is x + y?',['3','4','5','6','7'],2,'From the 2nd: y = 4x − 10. Substitute: 2x + 12x − 30 = 12 → x = 3, y = 2. x + y = 5.'),
H('Algebra','The sum of three consecutive even integers is 78. What is the largest?',['24','26','28','30','32'],2,'Middle = 78 ÷ 3 = 26. The integers are 24, 26, 28. Largest = 28.'),
H('Algebra','For x ≠ 3, which expression equals (x² − 9)/(x − 3)?',['x − 3','x + 3','x² − 3','x + 9','3'],1,'Factor: (x − 3)(x + 3)/(x − 3) = x + 3.'),
H('Algebra','How many integers x satisfy −3 < 2x − 1 ≤ 7?',['4','5','6','7','8'],1,'Add 1: −2 < 2x ≤ 8. Divide by 2: −1 < x ≤ 4. Integers 0, 1, 2, 3, 4 → 5.'),
H('Algebra','What is the product of the solutions of 2x² − 8x + 6 = 0?',['3','4','6','−3','−4'],0,'Product of roots = c/a = 6/2 = 3.'),
H('Algebra','y varies directly with x. When x = 4, y = 12. What is y when x = 10?',['24','28','30','36','40'],2,'y = kx → k = 3. y = 3(10) = 30.'),
H('Algebra','$2,000 earns 5% interest compounded annually. What is the balance after 2 years?',['$2,200.00','$2,205.00','$2,210.00','$2,250.00','$2,400.00'],1,'2000 × 1.05² = 2000 × 1.1025 = $2,205. Compound means multiply each year.'),
H('Algebra','4 liters of a 10% salt solution are mixed with 6 liters of a 20% salt solution. What is the salt percentage of the mixture?',['14%','15%','16%','17%','18%'],2,'Salt: 0.4 + 1.2 = 1.6 L in 10 L total → 16%.'),
H('Algebra','Which value of x satisfies |x − 2| < 3?',['−2','−1','5','6','3'],4,'−3 < x − 2 < 3 → −1 < x < 5. Only 3 is inside (endpoints excluded).'),
H('Functions','What is the minimum value of f(x) = x² − 4x + 7?',['2','3','4','7','−3'],1,'Vertex at x = −b/2a = 2. f(2) = 4 − 8 + 7 = 3.'),
H('Functions','If f(x) = 3x − 2, what is f⁻¹(10)?',['3','4','6','8','28'],1,'Solve 3x − 2 = 10 → x = 4. (Inverse asks: what input gives 10?)'),
H('Functions','If g(x) = x² − 1 and g(a) = 15 with a > 0, what is a?',['2','3','4','√14','8'],2,'a² − 1 = 15 → a² = 16 → a = 4.'),

let S;
const KEY='actmath.v1';
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  S=S||{};S.stats=S.stats||{};S.missed=S.missed||[];S.seen=S.seen||[];S.tests=S.tests||[];S.total=S.total||{r:0,n:0};S.daily=S.daily||{};S.done=S.done||{};S.exam=S.exam||'';
  TOPICS.forEach(t=>S.stats[t]=S.stats[t]||{r:0,n:0})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>new Date().toLocaleDateString('en-CA');
function record(q,ok){S.daily[today()]=(S.daily[today()]||0)+1;const s=S.stats[q.t];s.n++;S.total.n++;if(ok){s.r++;S.total.r++}
  S.missed=S.missed.filter(m=>m.q!==q.q);
  if(!ok)S.missed.push({t:q.t,q:q.q,c:q.c,a:q.a,e:q.e});
  if(S.missed.length>80)S.missed.shift();save()}
function getQs(n,topics){
  const all=topics&&topics.length?topics:TOPICS;
  const pool=shuffle(BANK.filter(b=>all.includes(b.t)));
  const unseen=pool.filter(b=>!S.seen.includes(b.id)),used=[];
  const out=[];
  for(const b of unseen.concat(pool.filter(b=>S.seen.includes(b.id)))){if(out.length>=Math.ceil(n*0.6))break;out.push(b)}
  let guard=0;const texts=new Set(out.map(o=>o.q));
  while(out.length<n&&guard++<800){const q=genQ();if(all.includes(q.t)&&!texts.has(q.q)){texts.add(q.q);out.push(q)}}
  // if a topic has no generator (rare), top up from bank
  for(const b of pool){if(out.length>=n)break;if(!out.includes(b))out.push(b)}
  out.forEach(q=>{if(q.id&&q.id[0]!=='g'&&!S.seen.includes(q.id))S.seen.push(q.id)});
  if(S.seen.length>BANK.length)S.seen=[];save();
  return shuffle(out).slice(0,n);
}

function daysLeft(){if(!S.exam)return null;return Math.round((new Date(S.exam+'T00:00')-new Date(today()+'T00:00'))/864e5)}
function streak(){let n=0;const d=new Date();if(!(S.daily[today()]>=10))d.setDate(d.getDate()-1);for(;;){const k=d.toLocaleDateString('en-CA');if(S.daily[k]>=10){n++;d.setDate(d.getDate()-1)}else break}return n}
function smartQs(n){
  const w=TOPICS.map(t=>{const s=S.stats[t];return Math.max(.15,1.15-(s.n>=3?s.r/s.n:.5))}),tot=w.reduce((a,b)=>a+b);
  const cnt=w.map(x=>Math.floor(n*x/tot));let rem=n-cnt.reduce((a,b)=>a+b);
  const ord=w.map((_,i)=>i).sort((a,b)=>w[b]-w[a]);for(let i=0;rem>0;i++,rem--)cnt[ord[i%6]]++;
  let qs=[];TOPICS.forEach((t,i)=>{if(cnt[i])qs=qs.concat(getQs(cnt[i],[t]))});return shuffle(qs);
}
function startSmart(n){startPractice([],n,smartQs(n));P.smart=true}

let P={};
function practice(){
  const sel=P.sel||[];
  app.innerHTML=`<div class="card"><h2>Topic Drill</h2><p class="mute">Pick topics (none = all), then start. You get instant feedback and an explanation after every question.</p>
  <div class="chips">${TOPICS.map(t=>`<span class="chip ${sel.includes(t)?'on':''}" onclick="tog('${t}')">${t} · ${pct(S.stats[t])}%</span>`).join('')}</div>
  <div class="chips">${[10,20,30].map(n=>`<button class="btn sm" onclick="startPractice(P.sel||[],${n})">Start ${n} questions</button>`).join('')}</div></div>`;
}
function tog(t){P.sel=P.sel||[];const i=P.sel.indexOf(t);i<0?P.sel.push(t):P.sel.splice(i,1);practice()}
function startPractice(topics,n,qs){view='run';P={sel:topics===TOPICS?[]:topics,mode:'practice',qs:qs||getQs(n,topics),i:0,right:0,ans:null,res:[]};runQ()}
function runQ(){
  const q=P.qs[P.i];P.t0=Date.now();
  app.innerHTML=`<div class="card pop"><div class="top"><span class="tag">${q.t}</span><span class="mute">Question ${P.i+1} of ${P.qs.length} · ✅ ${P.right}</span></div>
  <div class="dots">${P.qs.map((_,i)=>`<i class="${i<P.i?'c':i===P.i?'a':''}"></i>`).join('')}</div>
  <div class="q">${q.q}</div>
  ${q.c.map((c,i)=>`<button class="opt" onclick="answer(${i})"><span class="L">${LET[i]}</span><span>${c}</span></button>`).join('')}
  <div id="fb"></div></div>`;
}
function answer(i){
  if(P.ans!==null)return;P.ans=i;const q=P.qs[P.i],ok=i===q.a;
  if(ok)P.right++;record(q,ok);P.res.push({q,pick:i,ok,sec:Math.round((Date.now()-P.t0)/1000)});
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===i)b.classList.add('no')});
  const last=P.i===P.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="exp"><b>${ok?'✅ Correct!':'❌ Not quite — answer is '+LET[q.a]+'.'}</b>\n${q.e}</div><button class="btn" onclick="nextQ()">${last?'See results':'Next →'}</button>`;
}
function nextQ(){P.ans=null;P.i++;P.i>=P.qs.length?practiceDone():runQ()}
function practiceDone(){
  const n=P.qs.length;
  app.innerHTML=`<div class="card"><h2>Done! ${P.right}/${n} (${Math.round(100*P.right/n)}%)</h2>
  <p>${P.right/n>=.8?'🔥 Excellent work, Kieran!':P.right/n>=.6?'👍 Solid — review the misses below.':'💡 Every miss is a chance to learn. Read the explanations!'}</p>
  <p class="mute">⏱️ Average ${Math.round(P.res.reduce((a,r)=>a+r.sec,0)/n)} sec per question — ACT pace is about 60. ${P.res.filter(r=>r.sec>90).length?'Slowest: '+P.res.filter(r=>r.sec>90).length+' question(s) over 90 sec — practice skipping and coming back.':''}</p>
  <button class="btn" onclick="${'${P.smart?`startSmart(${n})`:`startPractice(P.sel,${n})`}'}">Go again</button> <button class="btn alt" onclick="go('home')">Home</button></div>
  <div class="card"><h3>Review</h3>${review(P.res)}</div>`;
}
function review(res){return res.map((r,k)=>`<div class="rv ${r.ok?'ok':'no'}"><b>${k+1}. ${r.q.q}</b><br>Your answer: ${r.pick==null?'<i>blank</i>':LET[r.pick]+') '+r.q.c[r.pick]} ${r.ok?'✅':'❌'}${r.sec!=null?' · '+r.sec+'s':''} · Correct: ${LET[r.q.a]}) ${r.q.c[r.q.a]}<div class="mute" style="white-space:pre-line">${r.q.e}</div></div>`).join('')}

/* ---- timed test ---- */
function test(){
  app.innerHTML=`<div class="card"><h2>Timed Test</h2><p class="mute">Real ACT pacing: <b>1 minute per question</b>. Mixed topics. You can skip and come back. Missed questions go to your review list.</p>
  <div class="grid">${[[15,'Mini','15 min'],[30,'Half','30 min'],[60,'Full ACT Math','60 min']].map(([n,l,m])=>`<button class="tile" onclick="startTest(${n})"><b>${l}</b><span class="mute">${n} questions · ${m}</span></button>`).join('')}</div></div>`;
}
function startTest(n){view='run';P={mode:'test',qs:getQs(n),i:0,picks:new Array(n).fill(null),flags:new Array(n).fill(false),left:n*60};
  clearInterval(timer);timer=setInterval(()=>{P.left--;const el=document.getElementById('tm');if(el){el.textContent=mmss(P.left);el.classList.toggle('low',P.left<=60)}if(P.left<=0)finishTest()},1000);tq()}
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function tq(){
  const q=P.qs[P.i],n=P.qs.length;
  app.innerHTML=`<div class="card pop"><div class="top"><span class="tag">Question ${P.i+1} of ${n}</span><span class="timer ${P.left<=60?'low':''}" id="tm">${mmss(P.left)}</span></div>
  <div class="dots">${P.qs.map((_,i)=>`<i class="${P.picks[i]!==null?'c':''} ${i===P.i?'a':''} ${P.flags[i]?'f':''}" style="cursor:pointer" onclick="P.i=${i};tq()"></i>`).join('')}</div>
  <div class="q">${q.q}</div>
  ${q.c.map((c,i)=>`<button class="opt ${P.picks[P.i]===i?'sel':''}" onclick="P.picks[P.i]=${i};tq()"><span class="L">${LET[i]}</span><span>${c}</span></button>`).join('')}
  <div class="chips"><button class="btn sm alt" ${P.i?'':'disabled'} onclick="P.i--;tq()">← Back</button>
  <button class="btn sm" ${P.i<n-1?'':'disabled'} onclick="P.i++;tq()">Next →</button>
  <button class="btn sm alt" onclick="P.flags[P.i]=!P.flags[P.i];tq()">${P.flags[P.i]?'🚩 Flagged':'⚑ Flag to revisit'}</button>
  <button class="btn sm alt" onclick="if(confirm('Submit test? ${P.picks.filter(x=>x===null).length} unanswered (blanks count wrong — guess!).'))finishTest()">Submit test</button></div></div>`;
}
function finishTest(){
  clearInterval(timer);const n=P.qs.length;let right=0;const res=[];
  P.qs.forEach((q,i)=>{const p=P.picks[i],ok=p===q.a;if(ok)right++;res.push({q,pick:p,ok});if(p!==null)record(q,ok);else{S.missed=S.missed.filter(m=>m.q!==q.q);S.missed.push({t:q.t,q:q.q,c:q.c,a:q.a,e:q.e})}});
  const sc=scaled(Math.round(60*right/n));S.tests.push({n,right,scaled:sc,d:Date.now()});save();
  const by={};res.forEach(r=>{by[r.q.t]=by[r.q.t]||{r:0,n:0};by[r.q.t].n++;if(r.ok)by[r.q.t].r++});
  const prev=S.tests.slice(0,-1).slice(-1)[0];
  app.innerHTML=`<div class="card"><h2>Test complete</h2><div class="grid"><div><div class="big">${right}/${n}</div><div class="mute">Correct</div></div><div><div class="big">≈ ${sc}</div><div class="mute">Estimated ACT Math score${prev?` (last: ${prev.scaled})`:''}</div></div></div>
  <p class="mute">Estimate only — real scaling varies by test form.</p>
  <table>${Object.entries(by).map(([t,s])=>`<tr><td>${t}</td><td>${s.r}/${s.n}</td><td style="width:40%"><div class="bar"><i style="width:${pct(s)}%"></i></div></td></tr>`).join('')}</table>
  <p><button class="btn" onclick="go('test')">Another test</button> <button class="btn alt" onclick="go('missed')">Drill my misses</button></p></div>
  <div class="card"><h3>Full review</h3>${review(res)}</div>`;
  view='done';
}

  <tr><td>Triangle area</td><td>½·b·h</td></tr>
  <tr><td>Circle</td><td>A = πr² · C = 2πr · arc = (θ/360)·2πr · sector = (θ/360)·πr²</td></tr>
  <tr><td>Pythagorean</td><td>a² + b² = c² · triples 3-4-5, 5-12-13, 8-15-17, 7-24-25</td></tr>
  <tr><td>45-45-90</td><td>x, x, x√2</td></tr>
  <tr><td>30-60-90</td><td>x, x√3, 2x</td></tr>
  <tr><td>Polygon angle sum</td><td>(n − 2)·180°</td></tr>
  <tr><td>Trapezoid</td><td>½(b₁ + b₂)h</td></tr>
  <tr><td>Box / cylinder / sphere</td><td>lwh · πr²h · (4/3)πr³</td></tr>
  <tr><td>Cone / pyramid</td><td>⅓·(base area)·h</td></tr>
  <tr><td>Distance / midpoint</td><td>√[(x₂−x₁)² + (y₂−y₁)²] · ((x₁+x₂)/2, (y₁+y₂)/2)</td></tr>
  <tr><td>Circle equation</td><td>(x − h)² + (y − k)² = r²</td></tr></table></div>
  <div class="card"><h3>Trig</h3><table>
  <tr><td>SOH-CAH-TOA</td><td>sin = opp/hyp · cos = adj/hyp · tan = opp/adj</td></tr>
  <tr><td>Identity</td><td>sin²θ + cos²θ = 1 · tanθ = sinθ/cosθ</td></tr>
  <tr><td>Radians</td><td>180° = π · multiply degrees by π/180</td></tr>
  <tr><td>Special values</td><td>sin 30° = ½, sin 45° = √2/2, sin 60° = √3/2 · cos is the reverse</td></tr>
  <tr><td>Period</td><td>sin(bx), cos(bx): 2π/b</td></tr></table></div>
  <div class="card"><h3>Stats & Counting</h3><table>
  <tr><td>Mean</td><td>sum ÷ count · (mean × count = sum)</td></tr>
  <tr><td>Median</td><td>middle of sorted list (average the middle two if even)</td></tr>
  <tr><td>Probability</td><td>favorable ÷ total · "and" → multiply · "or" → add</td></tr>
  <tr><td>Permutations</td><td>n! · nPr = n!/(n−r)!</td></tr>
  <tr><td>Combinations</td><td>nCr = n!/(r!(n−r)!)</td></tr>
  <tr><td>Counting principle</td><td>multiply the choices at each step</td></tr>

  <li>Skip anything over 90 seconds, mark it, come back.</li>

  <li>Sleep, eat breakfast, arrive early. You've got this, Kieran. 💜</li></ul></div>`;
}

/* ---------- floating calculator ---------- */
const Calc=(()=>{
  let deg=true,ans=0,fresh=false;
  const FN={sin:x=>Math.sin(deg?x*Math.PI/180:x),cos:x=>Math.cos(deg?x*Math.PI/180:x),tan:x=>Math.tan(deg?x*Math.PI/180:x),
    asin:x=>{const r=Math.asin(x);return deg?r*180/Math.PI:r},acos:x=>{const r=Math.acos(x);return deg?r*180/Math.PI:r},atan:x=>{const r=Math.atan(x);return deg?r*180/Math.PI:r},
    log:Math.log10,ln:Math.log,sqrt:Math.sqrt};
  function evaluate(str){
    const src=str.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,'');
    const tk=src.match(/\d+\.?\d*|\.\d+|asin|acos|atan|sin|cos|tan|log|ln|sqrt|ANS|π|e|[-+*/^()]/g)||[];
    if(tk.join('')!==src)throw 0;
    let p=0;const peek=()=>tk[p],next=()=>tk[p++];
    const startsAtom=t=>t&&(/^[\d.]/.test(t)||t==='('||t==='π'||t==='e'||t==='ANS'||FN[t]);
    function expr(){let v=term();while(peek()==='+'||peek()==='-'){v=next()==='+'?v+term():v-term()}return v}
    function term(){let v=unary();for(;;){const t=peek();if(t==='*'){next();v*=unary()}else if(t==='/'){next();v/=unary()}else if(startsAtom(t)){v*=unary()}else return v}}
    function unary(){if(peek()==='-'){next();return -unary()}if(peek()==='+'){next();return unary()}return power()}
    function power(){const b=atom();if(peek()==='^'){next();return Math.pow(b,unary())}return b}
    function atom(){const t=next();
      if(t===undefined)throw 0;
      if(/^[\d.]/.test(t))return parseFloat(t);
      if(t==='π')return Math.PI;if(t==='e')return Math.E;if(t==='ANS')return ans;
      if(t==='('){const v=expr();if(peek()===')')next();return v}
      if(FN[t]){if(next()!=='(')throw 0;const v=expr();if(peek()===')')next();return FN[t](v)}
      throw 0}
    const v=expr();if(p<tk.length)throw 0;return v;
  }
  const $=id=>document.getElementById(id);
  const disp=()=>$('cdisp');
  function put(t,isOp){const d=disp();
    if(fresh){if(!isOp&&!/^[+−×÷^]/.test(t)&&t!=='^2'&&t!=='^(-1)')d.value='';else if(isOp&&t==='π')d.value=''}
    fresh=false;d.value+=t;$('chist').textContent=''}
  function equals(){const d=disp();if(!d.value.trim())return;
    try{let r=evaluate(d.value);if(!isFinite(r)||isNaN(r))throw 0;r=parseFloat(r.toPrecision(12));
      $('chist').textContent=d.value+' =';d.value=String(r);ans=r;fresh=true}
    catch(e){$('chist').textContent=d.value;d.value='Error';fresh=true}}
  const KEYS=[
    ['DEG','DEG','op'],['sin(','sin','op'],['cos(','cos','op'],['tan(','tan','op'],['AC','AC','cl'],
    ['asin(','sin⁻¹','op'],['acos(','cos⁻¹','op'],['atan(','tan⁻¹','op'],['(','(', 'op'],[')',')','op'],
    ['sqrt(','√','op'],['log(','log','op'],['ln(','ln','op'],['^','xʸ','op'],['bs','⌫','cl'],
    ['π','π','op'],['e','e','op'],['^2','x²','op'],['^(-1)','1/x','op'],['÷','÷','op'],
    ['7'],['8'],['9'],['ANS','ANS','op'],['×','×','op'],
    ['4'],['5'],['6'],['(-','(−)','op'],['−','−','op'],
    ['1'],['2'],['3'],['0'],['+','+','op'],
    ['.','.'],['=','=','eq']];
  function init(){
    $('ckeys').innerHTML=KEYS.map(([v,l,c],i)=>`<button data-i="${i}" class="${c||''}">${l||v}</button>`).join('');
    $('ckeys').onclick=e=>{const b=e.target.closest('button');if(!b)return;const [v]=KEYS[+b.dataset.i];
      if(v==='DEG'){deg=!deg;b.textContent=deg?'DEG':'RAD';return}
      if(v==='AC'){disp().value='';$('chist').textContent='';fresh=false;return}
      if(v==='bs'){if(fresh){disp().value='';fresh=false}else disp().value=disp().value.replace(/(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|log\(|ln\(|sqrt\(|ANS|.)$/,'');return}
      if(v==='=')return equals();
      put(v,/^[+−×÷^]|\^|π|e|ANS|\(|sin|cos|tan|log|ln|sqrt/.test(v))};
    disp().addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();equals()}});
    disp().addEventListener('input',()=>{fresh=false});
    $('cfab').onclick=()=>{const o=$('cpanel').classList.toggle('open');if(o&&matchMedia('(pointer:fine)').matches)disp().focus()};
    $('cx').onclick=()=>$('cpanel').classList.remove('open');
  }
  return{init,evaluate,setDeg:d=>deg=d,setAns:a=>ans=a};
})();
Calc.init();
load();draw();
</script>
